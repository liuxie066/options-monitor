[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "om-group-query-bot-plugin"
version = "0.1.0"
description = "Optional personal-group query bot for options-monitor"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["om_group_query_bot", "om_group_query_bot.*"]
namespaces = false
