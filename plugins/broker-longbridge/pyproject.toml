[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "om-broker-longbridge-plugin"
version = "0.1.0"
description = "Optional Longbridge broker adapter for options-monitor"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["om_broker_longbridge", "om_broker_longbridge.*"]
namespaces = false
