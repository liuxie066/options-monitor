name: Release from VERSION

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(tr -d '\n' < VERSION)"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-tag
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/guardrails.yml
    with:
      release_tag: ${{ needs.resolve-tag.outputs.tag }}
