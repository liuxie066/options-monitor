name: Reusable Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    outputs:
      published:
        description: Outcome of the source publication attempt
        value: ${{ jobs.release.outputs.published }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outcome }}
    timeout-minutes: 25
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          bash scripts/install_agent_plugin.sh
          ./.venv/bin/pip install pytest

      - name: Validate source identity
        run: ./.venv/bin/python .github/ci/release_checks.py identity

      - name: Build official plugin wheels and catalog
        run: ./.venv/bin/python scripts/build_plugin_wheels.py --output plugin-wheels

      - name: Validate release metadata
        run: |
          chmod +x ./om-agent
          ./.venv/bin/python scripts/release_check.py --tag "$RELEASE_TAG" --require-current-taxonomy --require-delta-coverage --defer-runtime-bundles --render-notes-out /tmp/release-notes.md
          ./.venv/bin/python .github/ci/runtime_release.py prepare-notes --notes /tmp/release-notes.md
          ./.venv/bin/python scripts/generate_dependency_graph.py --check
          ./om-agent spec > /tmp/om-agent-spec.json

      - name: Build source archive
        run: |
          git archive --format=tar.gz --output options-monitor-${{ inputs.tag }}.tar.gz HEAD

      - name: Verify source archive Python Bot
        run: |
          CHECKOUT_PYTHON="${{ github.workspace }}/.venv/bin/python"
          ARCHIVE_ROOT="$(mktemp -d "${RUNNER_TEMP}/options-monitor-archive.XXXXXX")"
          tar -xzf "options-monitor-${{ inputs.tag }}.tar.gz" -C "${ARCHIVE_ROOT}"
          cd "${ARCHIVE_ROOT}"
          "${CHECKOUT_PYTHON}" -c 'import src.application.bot.host; import src.application.bot.runtime'

      - name: Verify official plugin publication set
        run: ./.venv/bin/python scripts/build_plugin_wheels.py --output plugin-wheels --verify-only

      - name: Require current CodeQL and tag evidence
        run: ./.venv/bin/python .github/ci/release_checks.py before-publish

      - name: Publish release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-notes.md
          files: |
            options-monitor-${{ inputs.tag }}.tar.gz
            /tmp/om-agent-spec.json
            VERSION
            plugin-wheels/*

      - name: Read back publication outcome
        if: ${{ always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        run: ./.venv/bin/python .github/ci/release_checks.py readback --defer-runtime-bundles
