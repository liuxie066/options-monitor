name: Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements/dev.txt -c constraints/dev.txt

      - name: Lint
        run: |
          ./.venv/bin/python -m ruff check .

      - name: Guardrails checks
        run: |
          ./.venv/bin/python scripts/guardrails_check.py --check-doc-wording --check-runtime-config-tracking

      - name: Minimal regression
        run: |
          ./.venv/bin/python tests/run_smoke.py
          ./.venv/bin/python -m pytest \
            tests/test_quality_status_contract_vendor.py \
            tests/test_quality_document_ownership.py \
            tests/test_portfolio_management_contract_vendor.py \
            tests/test_release_check.py \
            tests/test_release_delta_coverage.py \
            tests/test_release_version_recommendation.py \
            tests/test_version_check.py
