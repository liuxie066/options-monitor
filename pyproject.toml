[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "om-strategy-core"
dynamic = ["version"]
description = "Pure ordinary CSP/CC strategy calculations"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["domain", "domain.domain", "domain.domain.*", "om_strategy_core"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "domain.domain.strategy_core.__version__"}

[tool.setuptools.cmdclass]
build_py = "om_strategy_core._build.BuildPy"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F821", "F822"]
